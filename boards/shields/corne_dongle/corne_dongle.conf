# Enable dongle mode
CONFIG_ZMK_USB=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Settings storage backend (required for BLE bonding)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# ZMK Studio Support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Battery Reporting (Genteure PR #2938 fork, ce880fa6)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_HID=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_PROXY=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_REPORT_LOWEST_CHARGE=y
